<div class="login-wrapper">

  <div class="login-container d-flex align-items-stretch">

    <!-- Carrusel lado izquierdo -->
    <div class="login-carousel-side">
      <div class="carousel carousel-fade h-100">
        <div class="carousel-inner h-100">
          <div
            *ngFor="let img of imagenesCarrusel; let i = index"
            class="carousel-item h-100"
            [class.active]="i === imagenActual"
          >
            <img [src]="img" class="carousel-img d-block" alt="Imagen {{ i + 1 }}">
          </div>
        </div>

        <button class="carousel-control-prev" type="button" (click)="anterior()">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Anterior</span>
        </button>
        <button class="carousel-control-next" type="button" (click)="siguiente()">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Siguiente</span>
        </button>
      </div>
    </div>

    <!-- Card login -->
    <div class="login-card card p-4">

      <div class="text-center mb-4">
        <i class="bi bi-mortarboard-fill text-primary login-icon"></i>
        <h4 class="mt-2 mb-1 fw-bold">Gestión de Proyectos de Investigación</h4>
        <p class="text-muted small mb-1">Doctorado en Ciencias de la Computación</p>
        <p class="text-muted small mb-1"> Universidad del Cauca </p>
      </div>

      <hr>

      <p class="text-center text-muted mb-4">Inicia sesión con tu cuenta de Unicauca para continuar</p>

      <div *ngIf="error" class="alert alert-danger d-flex align-items-center gap-2" role="alert">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span>{{ error }}</span>
      </div>

      <div class="d-flex justify-content-center">

        <div *ngIf="!cargando" #googleBtn></div>

        <div *ngIf="cargando" class="text-center py-2">
          <div class="spinner-border text-primary" role="status" aria-hidden="true"></div>
          <p class="mt-2 text-muted small mb-0">Verificando credenciales...</p>
        </div>

      </div>

    </div>

  </div>

</div>
