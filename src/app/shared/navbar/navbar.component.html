<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <div class="container-fluid px-4">

    <!-- Brand -->
    <a class="navbar-brand fw-bold" routerLink="/">
      <i class="bi bi-mortarboard-fill me-2"></i>Gestión de Proyectos
    </a>

    <!-- Toggle mobile -->
    <button
      class="navbar-toggler"
      type="button"
      (click)="menuAbierto = !menuAbierto"
      aria-label="Menú"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" [class.show]="menuAbierto">

      <ul class="navbar-nav me-auto mb-2 mb-lg-0">

        <!-- ADMINISTRADOR: gestión de docentes -->
        <ng-container *ngIf="esAdmin">
          <li class="nav-item dropdown">
            <a
              class="nav-link dropdown-toggle"
              href="#"
              role="button"
              data-bs-toggle="dropdown"
              aria-expanded="false"
              (click)="$event.preventDefault()"
            >
              <i class="bi bi-people me-1"></i>Docentes
            </a>
            <ul class="dropdown-menu">
              <li>
                <a class="dropdown-item" routerLink="/docentes">
                  <i class="bi bi-list-ul me-1"></i>Listar docentes
                </a>
              </li>
              <li>
                <a class="dropdown-item" routerLink="/docentes/registrar">
                  <i class="bi bi-person-plus me-1"></i>Registrar docente
                </a>
              </li>
            </ul>
          </li>
        </ng-container>

        <!-- DOCENTE: sus propios proyectos -->
        <ng-container *ngIf="esDocente && idDocente">
          <li class="nav-item">
            <a class="nav-link" [routerLink]="['/docentes', idDocente, 'proyectos']" routerLinkActive="active">
              <i class="bi bi-folder2-open me-1"></i>Mis proyectos
            </a>
          </li>
        </ng-container>

        <!-- Todos los roles autenticados: buscar proyectos -->
        <li class="nav-item">
          <a class="nav-link" routerLink="/proyectos/filtrar" routerLinkActive="active">
            <i class="bi bi-search me-1"></i>Buscar proyectos
          </a>
        </li>

      </ul>

      <!-- Usuario + cerrar sesión -->
      <ul class="navbar-nav ms-auto align-items-lg-center gap-2">
        <li class="nav-item">
          <span class="navbar-text text-white-50 small me-2">
            <i class="bi bi-person-circle me-1"></i>{{ nombre }}
            <span
              class="badge ms-1"
              [class.bg-warning]="esAdmin"
              [class.text-dark]="esAdmin"
              [class.bg-info]="esDocente"
            >
              {{ esAdmin ? 'Admin' : 'Docente' }}
            </span>
          </span>
        </li>
        <li class="nav-item">
          <button class="btn btn-outline-light btn-sm" (click)="cerrarSesion()">
            <i class="bi bi-box-arrow-right me-1"></i>Cerrar sesión
          </button>
        </li>
      </ul>

    </div>
  </div>
</nav>
